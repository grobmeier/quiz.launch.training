name: Verify and deploy static site to S3
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-static-site
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  deploy:
    name: Deploy verified export
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: static-site
          path: out
      - name: Check deployment payload
        run: |
          test -s out/index.html
          test -d out/_next/static
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: eu-west-1
      - name: Publish the verified static files
        run: aws s3 sync out/ s3://quiz.launch.training --delete --region eu-west-1 --cache-control "max-age=60"
      - name: Invalidate the existing CloudFront distribution
        run: aws cloudfront create-invalidation --distribution-id E3L1GO5KCNCT7W --paths '/*'
